  # opened over the lobby on a normal round-end, unprompted by any wingman
  # click — same blackout shape as STALL_PROFILE, different screen. Detect
  # + click are the same crop (like STALL_RETRY): CONFIRM is both the
  # overlay's own label and a real button, so clicking it does not risk
  # firing on a label-only text the way STALL_PROFILE's title would.
  # Coordinates measured directly from the archived reference frame
  # (pixel color thresholding around the button, not estimated).
