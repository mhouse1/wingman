unattended_mode: true
loop_interval_sec: 1.5
region: {left: 0, top: 0, width: 1920, height: 1200}
monitor: 1
enemy_hsv:
  lower: [0, 120, 120]
  upper: [10, 255, 255]
crops:
  respawn:
    coords:
    - [0.4188, 0.6978]
    - [0.5292, 0.7233]
    text: [RESPAWN]
  incoming:
    coords:
    - [0.4618, 0.2556]
    - [0.5361, 0.2844]
    text: [MING, ARNING]
  click_to:
    coords:
    - [0.4097, 0.8956]
    - [0.5687, 0.9289]
    text: [CLICKTO, LICKTO, CLICK]
  good_luck:
    coords:
    - [0.9035, 0.0244]
    - [0.991, 0.2789]
    text: [GOODLUCK, GOOD, LUCK]
  event_refresh:
    coords:
    - [0.4597, 0.3167]
    - [0.7035, 0.5422]
    text: [AGAINSO, AGAIN]
  event_refresh_dismiss:
    coords:
    - [0.7236, 0.8556]
    - [0.9792, 0.97]
  REVEAL_ALL:
    coords:
    - [0.8132, 0.8633]
    - [0.9375, 0.9011]
    text: [REVEAL]
  TAP_HERE_TO_CONTINUE:
    coords:
    - [0.4139, 0.8467]
    - [0.5861, 0.8767]
    text: [TAP, CONTINUE]
  UNLOCK_CLOSE:
    coords:
    - [0.1264, 0.6433]
    - [0.2035, 0.6856]
    text: [CLOSE]
  FINAL_CONTINUE:
    coords:
    - [0.8257, 0.9156]
    - [0.9243, 0.9444]
    text: [CONTINUE]
  HEALTH:
    coords:
    - [0.3944, 0.95]
    - [0.4208, 0.9756]
  PLAY:
    coords:
    - [0.7944, 0.8844]
    - [0.9125, 0.9389]
    text: [PLAY]
  READY:
    coords:
    - [0.7993, 0.8656]
    - [0.9069, 0.9111]
    text: [READY]
  CANCEL:
    coords:
    - [0.7896, 0.8678]
    - [0.9167, 0.9089]
    text: [CANCEL]
  CREATION_FAILED:
    coords:
    - [0.4826, 0.5089]
    - [0.5167, 0.5378]
    text: [OK]
  INSPECT:
    coords:
    - [0.0285, 0.0289]
    - [0.184, 0.0556]
    text: [INSPECTAIRCRAFT]
  INVITED:
    coords:
    - [0.5833, 0.5711]
    - [0.6542, 0.5967]
    text: [INVITED]
  UNREADY:
    coords:
    - [0.7764, 0.8678]
    - [0.9299, 0.9067]
    text: [READY]
respawn_detection:
  use_ocr: true
  use_gpu: false
  ocr_cooldown: 0.2
  text_hsv_lower: [0, 0, 180]
  text_hsv_upper: [180, 50, 255]
  text_threshold: 0.001
  bar_hsv_lower: [80, 100, 100]
  bar_hsv_upper: [100, 255, 255]
  bar_threshold: 0.0005
mission: {restart_delay_after_unlock: 4.0, restart_retry_interval: 2.0, respawn_fallback_timeout: 20.0,
  weapon_loop_interval: 0.5}
aim: {smoothing: 0.25, fire_cooldown: 0.2}
controls: {left_mouse_button: true, fire_button: left, fire_hold: 2.0}
debug: {show_window: false, show_grid_highlighted: false, draw_markers: true, debug_output_dir: tests/test-output}
