# ADR 099: run the game on its own nested X display, where it is the only
# client and therefore always focused, and whose root window is a real
# framebuffer XGetImage can read. Wingman then cannot type into the operator's
# editor because they no longer share a display.
#
# Only capture and injection move to `display`. Hotkey observation deliberately
# stays on the operator's DISPLAY, so backspace / end / i-j-k-l keep working
# from wherever they are actually typed.
#
# Override per run without editing this file: make rd NESTED=0
nested:
  enabled: true
  display: ":3"
  size: "1920x1200"
  # ADR 156: Xwayland 24.1.10 delivers wingman's clicks only while the
  # operator's mouse is over the nested window (Anomaly 009). When it is not, a
  # click detaches the nested server's host-mouse devices for as long as the
  # click takes, then reattaches them. The operator's mouse works in the game
  # window as before. false: never detach, clicks land only under the mouse.
  isolate_pointer: true
  # ADR 157: release Alt, Ctrl, Shift or Super when one stays held on the nested
  # display for more than 1.5 s. This Xwayland leaves them down when the
  # operator Alt+Tabs away, and the game then reads the next Enter as Alt+Enter
  # and drops to a framed window that shifts every crop.
  release_stuck_modifiers: true
  # ADR 099 V3: the nested display is a window on the desktop, and while the
  # desktop is not drawing it (covered, minimised, another workspace) the game
  # falls to one frame a second: measured 2026-10-04 11:27, covered by a
  # browser, FPS 1 and three deaths. true holds one black pixel on top of the
  # game at the top-left corner of the nested display, which should keep its
  # frames on Xwayland's fast path whatever the desktop does. Off until a
  # flight with the window covered for more than five minutes confirms it.
  block_page_flips: false

# Design 011 (ACS Mode), step 1: which weapon-employment tactic the active
# airframe supports. Read once at startup into AnalyzerSnapshot.has_padlock.
# Nothing branches on this yet — every profile is has_padlock: true today —
# it exists so a future BoresightEngage leaf has something to condition on.
jet_profile:
  active: j20
  profiles:
    j20:
      has_padlock: true

unattended_mode: true
# Party invites: false clicks REJECT, true clicks ACCEPT then readies up.
# Default false — accepting drops the aircraft into someone else's squad
# mid-session and silently changes what an unattended soak is measuring.
# `make invite` toggles it for this machine in wingman/config.local.yaml
# (untracked, CR-018-16), never here.
accept_invite: false
loop_interval_sec: 1.5
