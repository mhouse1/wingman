respawn_detection:
  use_ocr: true
  use_gpu: false
  ocr_cooldown: 0.2
  text_hsv_lower: [0, 0, 180]
  text_hsv_upper: [180, 50, 255]
  mode: dual
health: {death_no_digits_s: 6.0, max_plausible: 500, value_confirm_window: 3, value_confirm_tolerance: 15,
  death_no_confirmed_s: 8.0, decline_evidence_drop: 80, decline_evidence_window_s: 6.0}
incoming_detection:
  incoming_template_matching_enabled: true
  incoming_template_threshold: 0.82
  incoming_template_near_threshold_low: 0.76
  incoming_template_near_threshold_high: 0.81
  incoming_template_fallback_to_ocr: true
  incoming_template_telemetry_info: false
  incoming_debounce_ms: 500
  incoming_template_scales: [1.0]
  incoming_template_sources: [test_screenshots/INCOMING3.png]
mission: {weapon_loop_interval: 1.0, no_missiles_consecutive_required: 2, no_missiles_abort_grace_s: 6.0,
  starting_stalled_reclassify_after_s: 20.0, respawn_clear_stability_s: 1.5, starting_max_wait_s: 90.0,
  good_luck_wait_s: 13.0, good_luck_bypass_on_alive: true, starting_health_probe_interval_s: 0.4}
debug: {show_window: false, show_grid_highlighted: false, draw_markers: true, capture_with_overlay: false,
  debug_output_dir: tests/test-output}
j20_mission:
  target_painting_mode: false
  attack_mode_dry_run: false       # log-only mode: compute intents, inject nothing
  min_safe_altitude: 500           # CFIT floor — all steering suppressed below
  bearing_deadzone_deg: 12         # no roll inside this bearing error
  short_ring_min_count: 1          # short-ring contacts required to orbit
  ring_debounce_ticks: 2           # consecutive ticks to enter or leave orbit
  ema_reseed_angle_deg: 60         # reseed steering EMA only on target jumps beyond this
  rear_commit_deg: 150             # commit turn direction when target is deep astern
  rear_release_deg: 90             # release only in the forward semicircle (18:21 tail-crossing finding)
  orbit_direction: right           # fixed orbit roll direction (right or left)
  orbit_roll_hold_s: 0.3           # roll hold per orbit correction
  orbit_roll_interval_s: 2.0       # cadence of orbit corrections
  coarse_kp: 0.5                   # gains passed to orient_nose_to_target
  coarse_min_hold_s: 0.15
  coarse_max_hold_s: 0.6
  coarse_cooldown_s: 2.0
behavior_tree:                     # ADR 024 Phase 3 — tactic selection
  mode: active                     # off | shadow (log only) | active (Engage geometry 3.1a + Eject/Disengage actuation 3.1b)
  disengage_after_s: 30            # all-rings-empty duration before DISENGAGE selects
  disengage_hold_s: 10             # minimum hold once DISENGAGE selected
  evade_hold_s: 10                 # minimum hold once EVADE selected
  # evade_health_threshold:        # unset — EVADE disabled until calibrated (ADR 024)
  missile_evade:                   # ADR 070 — MISSILE_EVADE_MODE
    enabled: false                 # false = leaf selection-only (shadow); true = hold AB+ROLL_RIGHT+YAW_LEFT
    clear_seconds: 3.0             # incoming absent this long ends the evade (d5); THE tuning knob
    min_clear_samples: 2           # fresh negative cache updates required — liveness floor, leave alone (d5)
    max_hold_s: 15.0               # unconditional release; firing = detector fault (d6)
minimap:                           # Design 003 — MINIMAP red-icon scan
  mask_radius_frac: 0.93           # circle mask radius as fraction of half the shorter side
  min_blob_px: 4                   # component area band for enemy icons
  max_blob_px: 120
  ema_alpha: 0.4                   # centroid-vector smoothing (dry-run 2026-08-08 jitter finding)
  ema_reset_after_s: 5.0           # reseed EMA after a detection gap this long
tracking:
  enabled: false
  acquisition_region_pct: [0.2, 0.18, 0.8, 0.68]
  deadband: 0.05
  kp: 0.3
  min_hold_sec: 0.08
  max_hold_sec: 0.35
  command_cooldown_sec: 0.15
  lost_timeout_sec: 0.7
  prefer_red_lock: true
  local_roi_enabled: true
  local_roi_scale: 0.22
  local_roi_min_px: [140, 90]
  local_roi_expand_factor: 1.25
  local_roi_max_scale: 0.45
  local_roi_reacquire_cycles: 3
tracking_hsv:
  red_lower: [0, 150, 150]
  red_upper: [10, 255, 255]
  green_lower: [45, 150, 150]
  green_upper: [75, 255, 255]
  min_contour_area: 12
  min_aspect_ratio: 2.5
hud: {enabled: true, output_path: tests/test-output/live_hud.png, interval_sec: 1.0}
telemetry:
  max_speed_mph: 2000
  max_altitude_ft: 60000
  max_speed_change_mph_s: 300
  plausibility_margin: 1.5
  max_gate_dt_s: 1.5
  reseed_after_rejections: 3
  smoothing_window: 3
  stale_after_s: 6.0
  trend_min_alt_rate_fps: 20.0
  trend_min_speed_rate_mph_s: 15.0
  steep_dive_min_sin: 0.8
  level_max_sin: 0.15
  ocr_every_n_ticks: 2
  # ADR 069 — impulse rotation + ballistic descent. Rotation is PULSED and then
  # observed; the descent itself is hands-off. Thresholds picked from 624
  # archived eject windows: ballistic descents median -117 m/s, held -80 m/s.
  eject_closed_loop: {enabled: true, check_interval_s: 1.5, confirm_consecutive: 2,
    legacy_nose_hold_s: 5.0, over_rotation_after_s: 6.0,
    target_dive_angle_deg: 65.0,    # THE criterion: dive must reach this angle.
                                    # 75 proved unreachable — the game oscillates the
                                    # flight path around a -58 median, so 2 consecutive
                                    # samples at -75 never occurred in 8 ejects. -65
                                    # establishes in 6 of 8 (2026-08-10 18:50).
    dive_angle_floor_deg: 55.0,     # sagging past this resumes rotation. Steeper than
                                    # the -47 sag that prompted this fix, so that case
                                    # is corrected; the 10 deg deadband above absorbs
                                    # normal oscillation.
    descent_target_mps: 100.0,      # fallback criterion when the angle is unavailable
    descent_floor_mps: 50.0,        # fallback floor when the angle is unavailable
    rotation_pulse_s: 2.0,          # bounded NOSE_DOWN impulse
    observe_after_pulse_s: 3.5,     # mandatory look-before-acting gap (one refresh)
    max_rotation_pulses: 12,        # actuation budget, replaces total_nose_budget_s.
                                    # Raised 4 -> 6 -> 12: pulses now also MAINTAIN the
                                    # dive angle through the descent, not just establish
                                    # it. Bounded per-pulse, gated by the over-rotation
                                    # guard (0 misfires in 52 ejects) and by eject_max_s.
    eject_max_s: 120.0}             # wall-clock backstop for the whole sequence
performance:
  round_histogram: {enabled: true, png_enabled: false, png_every_n_rounds: 0, output_dir: docs/performance}
  regression: {min_sessions: 5, min_cycles: 1000, threshold_pct: 20}
