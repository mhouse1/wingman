unattended_mode: true
loop_interval_sec: 1.5
region: {left: 0, top: 0, width: 1920, height: 1200}
monitor: 1
enemy_hsv:
  lower: [0, 120, 120]
  upper: [10, 255, 255]
crops:
  respawn:
  - [0.4188, 0.6978]
  - [0.5292, 0.7233]
  incoming:
  - [0.4618, 0.2556]
  - [0.5361, 0.2844]
  click_to:
  - [0.4097, 0.8956]
  - [0.5687, 0.9289]
  good_luck:
  - [0.9035, 0.0244]
  - [0.991, 0.2789]
  event_refresh:
  - [0.4597, 0.3167]
  - [0.7035, 0.5422]
  ready_button:
  - [0.7535, 0.84]
  - [0.9785, 0.97]
  event_refresh_dismiss:
  - [0.7236, 0.8556]
  - [0.9792, 0.97]
respawn_detection:
  use_ocr: true
  use_gpu: false
  ocr_cooldown: 0.2
  text_hsv_lower: [0, 0, 180]
  text_hsv_upper: [180, 50, 255]
  text_threshold: 0.001
  bar_hsv_lower: [80, 100, 100]
  bar_hsv_upper: [100, 255, 255]
  bar_threshold: 0.0005
mission: {restart_delay_after_unlock: 4.0, restart_retry_interval: 2.0, respawn_fallback_timeout: 20.0,
  weapon_loop_interval: 0.5}
aim: {smoothing: 0.25, fire_cooldown: 0.2}
controls: {left_mouse_button: true, fire_button: left, fire_hold: 2.0}
debug: {show_window: false, show_grid_highlighted: false, draw_markers: true, debug_output_dir: tests/test-output}
