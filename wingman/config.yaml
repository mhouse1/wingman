  # be the SAME parts-currency flow as STALL_PARTS_CONFIRM above: clicking
  # the crate's glowing '?' opens it and transitions directly into that
  # screen. Unlike STALL_PARTS_CONFIRM, clicking here commits nothing — it
  # only reveals/collects a reward the operator already owns — so this IS
  # wired into auto-recovery (see STALL_RECOVERY_CROPS, analyzer.py).
  # Detection text measured from the "+100 UNIVERSAL PARTS" banner;
  # STALL_PARTS_CRATE_DISMISS is the '?' mark itself (both pixel-color-
  # thresholded from the archived reference frame).
  STALL_PARTS_CRATE:
