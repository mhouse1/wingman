respawn_detection:
  use_ocr: true
  use_gpu: false
  ocr_cooldown: 0.2
  text_hsv_lower: [0, 0, 180]
  text_hsv_upper: [180, 50, 255]
  text_threshold: 0.001
  bar_hsv_lower: [80, 100, 100]
  bar_hsv_upper: [100, 255, 255]
  bar_threshold: 0.0005
incoming_detection:
  incoming_template_matching_enabled: true
  incoming_template_threshold: 0.82
  incoming_template_near_threshold_low: 0.76
  incoming_template_near_threshold_high: 0.81
  incoming_template_fallback_to_ocr: true
  incoming_template_telemetry_info: true
  incoming_debounce_ms: 500
  incoming_template_scales: [1.0]
  incoming_template_sources: [test_screenshots/INCOMING3.png]
mission: {restart_delay_after_unlock: 4.0, restart_retry_interval: 2.0, respawn_fallback_timeout: 20.0,
  weapon_loop_interval: 1.0, no_missiles_consecutive_required: 2, no_missiles_abort_grace_s: 6.0,
  starting_stalled_reclassify_after_s: 20.0, respawn_clear_stability_s: 1.5, starting_max_wait_s: 90.0}
aim: {smoothing: 0.25, fire_cooldown: 0.2}
controls: {left_mouse_button: true, fire_button: left, fire_hold: 2.0}
debug: {show_window: false, show_grid_highlighted: false, draw_markers: true, capture_with_overlay: false,
  debug_output_dir: tests/test-output}
j20_mission: {target_painting_mode: false}
tracking:
  enabled: false
  acquisition_region_pct: [0.2, 0.18, 0.8, 0.68]
  deadband: 0.05
  kp: 0.3
  min_hold_sec: 0.08
  max_hold_sec: 0.35
  command_cooldown_sec: 0.15
  lost_timeout_sec: 0.7
  prefer_red_lock: true
  local_roi_enabled: true
  local_roi_scale: 0.22
  local_roi_min_px: [140, 90]
  local_roi_expand_factor: 1.25
  local_roi_max_scale: 0.45
  local_roi_reacquire_cycles: 3
tracking_hsv:
  red_lower: [0, 150, 150]
  red_upper: [10, 255, 255]
  green_lower: [45, 150, 150]
  green_upper: [75, 255, 255]
  min_contour_area: 12
  min_aspect_ratio: 2.5
hud: {enabled: true, output_path: tests/test-output/live_hud.png, interval_sec: 1.0}
telemetry:                          # ADR 038 — altitude/speed signal model
  max_speed_mph: 2000               # absolute envelope; fallback altitude-gate bound when speed is stale
  max_altitude_ft: 60000            # absolute envelope; readings beyond are never seedable
  max_speed_change_mph_s: 300       # acceleration envelope for the speed plausibility gate
  plausibility_margin: 1.5          # slack multiplier on both gates
  reseed_after_rejections: 3        # consecutive rejections before the seed is discarded
  smoothing_window: 3               # accepted readings averaged into stable_value
  stale_after_s: 6.0                # signal age beyond which consumers must not act on it
  trend_min_alt_rate_fps: 20.0      # |altitude rate| below this is 'flat'
  trend_min_speed_rate_mph_s: 15.0  # |speed rate| below this is 'flat'
  steep_dive_min_sin: 0.5           # |alt_rate/speed| at or above → steep dive/climb band
  level_max_sin: 0.15               # |alt_rate/speed| at or below → level band
  eject_closed_loop:
    enabled: true                   # verify nose-down/afterburner from telemetry during eject
    verify_window_s: 6.0            # time allowed for the steep-dive band to appear after NOSE_DOWN
    check_interval_s: 1.5           # telemetry poll cadence inside the eject thread
    max_corrections: 3              # bound on corrective re-issues per eject sequence
    legacy_nose_hold_s: 5.0         # open-loop hold used when telemetry gives no evidence
performance:
  round_histogram: {enabled: true, png_enabled: false, png_every_n_rounds: 0, output_dir: docs/performance}
  regression: {min_sessions: 5, min_cycles: 1000, threshold_pct: 20}
