# ADR044 PATH1 runtime gate profile.
# Tuned for full wingman.main startup where OCR workers and initial state
# classification can consume the first few seconds.

# The configuration this path models. PATH1 pins the J20 flow, in which the
# missiles-empty response ejects from GAME_BATTLE (P1_040 at 52 s). The shipped
# default mission became su30 on 2026-09-24 (0f2e94e); its pursuit takes the
# aircraft into GAME_BATTLE_EJECT before missiles run out, so the missiles_empty
# checkpoint failed on every run from then on (measured 2026-09-27, identically on
# eb709e5 and after the code review 018 changes).
config_overrides:
  mission:
    default_mission: j20

PATH1_RUNTIME:
  # Startup frame only: no assertion on this step.
  - screenshot_name: P1_000_LOBBY_PLAY.png
    injection_time_s: 0.0

  - screenshot_name: P1_010_WAITING_CANCEL_VISIBLE.png
    injection_time_s: 15.0
    expected_state: GAME_STARTING
    expected_trigger: cancel_detected
    max_settle_time_s: 30.0

  - screenshot_name: P1_020_GOOD_LUCK_VISIBLE.png
    injection_time_s: 30.0
    expected_state: GAME_BATTLE
    expected_trigger: good_luck_detected
    max_settle_time_s: 30.0

  - screenshot_name: P1_040_BATTLE_HUD_MISSILES_0_HEALTH_ALIVE.png
    injection_time_s: 52.0
    expected_state: GAME_BATTLE
    expected_trigger: missiles_empty
    max_settle_time_s: 12.0

  # The post-eject respawn/restart flow was previously UNASSERTED here — the
  # health-gated restart could silently stop working while this gate stayed
  # green. These two expectations pin it: respawn detection, then the
  # alive-event restart (the ONLY restart path since the scheduled-restart
  # machinery was removed).
  - screenshot_name: P1_050_RESPAWN_VISIBLE_NO_HEALTH.png
    injection_time_s: 65.0
    expected_state: GAME_BATTLE
    expected_trigger: respawn_detected
    max_settle_time_s: 12.0

  - screenshot_name: P1_060_BATTLE_HUD_HEALTH_ALIVE_MISSILES_4.png
    injection_time_s: 73.0
    expected_state: GAME_BATTLE
    expected_trigger: restart_last_mission
    max_settle_time_s: 12.0

  - screenshot_name: P1_070_CLICK_TO_CONTINUE.png
    injection_time_s: 80.0

  - screenshot_name: P1_080_LOBBY_AFTER_MISSION.png
    injection_time_s: 84.0
