# ADR045 PATH1 live-screen realism lane.
# injection_time_s is used by the presenter utility for on-screen scheduling.

PATH1_LIVE:
  - screenshot_name: P1_000_LOBBY_PLAY.png
    injection_time_s: 0.0
    expected_state: GAME_LOBBY

  - screenshot_name: P1_010_WAITING_CANCEL_VISIBLE.png
    injection_time_s: 15.0
    expected_state: GAME_STARTING
    expected_trigger: cancel_detected

  - screenshot_name: P1_020_GOOD_LUCK_VISIBLE.png
    injection_time_s: 30.0
    expected_state: GAME_BATTLE
    expected_trigger: good_luck_detected

  # Shipped config runs pursuit mode (HLDD 015) here, not the legacy
  # missiles_empty -> eject_and_dive sequence. The default su30 mission sees
  # the target icon on this frame and hands the aircraft to pursuit itself,
  # entering GAME_BATTLE_EJECT without fire_eject(), so the missiles_empty
  # trigger never fires on that route. Entering the state is the one signal
  # both routes (mission handoff, confirmed-empty fire_eject) share.
  - screenshot_name: P1_040_BATTLE_HUD_MISSILES_0_HEALTH_ALIVE.png
    injection_time_s: 52.0
    expected_state: GAME_BATTLE_EJECT
    expected_trigger: state_enter:game_battle_eject
