# tests/calibration_map.yaml
# Maps each reference screenshot to the crop names it covers.
# Run: python tests/calibrate.py
#
# IMPORTANT: screenshots must be captured at the same region dimensions as
# config.yaml region.width × region.height. The tool validates this on startup
# and refuses to run if there is a mismatch.
#
# To capture reference screenshots:
#   1. Launch the game and navigate to the relevant screen.
#   2. Press V in wingman to save a screenshot with crop overlays.
#   3. Copy the raw screenshot (without overlays) to test_screenshots/ and
#      add it here under the appropriate crops list.

calibration:
  - screenshot: integration_test/P1_050_RESPAWN_VISIBLE_NO_HEALTH.png  # respawn overlay (gate corpus, make p1 refreshes)
    crops: [respawn]
  - screenshot: INCOMING.png          # 1920×1200 — incoming missile warning
    crops: [incoming]
  - screenshot: integration_test/P1_070_CLICK_TO_CONTINUE.png  # click to continue (gate corpus, make p1 refreshes)
    crops: [click_to]
  - screenshot: integration_test/P1_020_GOOD_LUCK_VISIBLE.png  # good luck / game starting (gate corpus, make p1 refreshes)
    crops: [good_luck]
  - screenshot: integration_test/P1_000_LOBBY_PLAY.png  # lobby play button (gate corpus, make p1 refreshes)
    crops: [PLAY]
  - screenshot: UNREADY.png  # 1920×1200 — event refresh popup
    crops: [event_refresh, event_refresh_dismiss]
  - screenshot: integration_test/P1_030_BATTLE_HUD_MISSILES_4.png  # battle minimap, top-right circle (ADR 072; MINIMAP.png stays as a CV test fixture)
    crops: [MINIMAP]
  - screenshot: integration_test/P1_010_WAITING_CANCEL_VISIBLE.png  # matchmaking CANCEL button (ADR 072 — closes an unmapped-crop gap)
    crops: [CANCEL]
  - screenshot: integration_test/P1_060_BATTLE_HUD_HEALTH_ALIVE_MISSILES_4.png  # health digits bottom-left (ADR 072 — closes an unmapped-crop gap)
    crops: [HEALTH]
  - screenshot: integration_test/P1_030_BATTLE_HUD_MISSILES_4.png  # battle HUD (gate corpus) — both ammo counters visible
    crops: [AMMO_FLARES, AMMO_MISSILE]
