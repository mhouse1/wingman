[project]
name = "metalstorm-wingman"
version = "0.1.0"
description = "Autonomous wingman prototype for MetalStorm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"opencv-python",
	"numpy",
	"mss",
	"pyyaml",
	"pyautogui",
	"keyboard>=0.13.5",
	"plotly>=6.6.0",
	"pandas>=2.3.3",
	"easyocr",
	"colorama",
	"transitions",
	"py-trees>=2.5.0",
]

[dependency-groups]
dev = [
	"pytest",
	"pytest-html",
	"strictdoc==0.27.1",
]

[tool.uv]
# optional uv-specific configuration can go here

[tool.pytest.ini_options]
markers = [
	"slow: slow integration tests requiring real OCR screenshots (deselect with -m 'not slow')",
]
filterwarnings = [
	"ignore:torch\\.ao\\.quantization is deprecated and will be removed in 2\\.10\\..*:DeprecationWarning:easyocr\\.detection",
	"ignore:torch\\.ao\\.quantization is deprecated and will be removed in 2\\.10\\..*:DeprecationWarning:easyocr\\.recognition",
	"ignore:torch\\.ao\\.quantization is deprecated and will be removed in 2\\.10\\..*:DeprecationWarning:torch\\.ao\\.quantization\\.quantize",
	"ignore:'pin_memory' argument is set as true but no accelerator is found.*:UserWarning",
]
