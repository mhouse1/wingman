[project]
name = "metalstorm-wingman"
version = "0.1.0"
description = "Autonomous wingman prototype for MetalStorm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"opencv-python",
	"numpy",
	"mss",
	"pyyaml",
	"pyautogui",
	"keyboard>=0.13.5",
	"plotly>=6.6.0",
	"pandas>=2.3.3",
	"easyocr",
	"colorama",
	"transitions",
]

[dependency-groups]
dev = [
	"pytest",
	"pytest-html",
]

[tool.uv]
# optional uv-specific configuration can go here
